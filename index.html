<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parallens 用户管理 Demo</title>
<style>
:root{--blue:#2f61f8;--ink:#303133;--text:#606266;--muted:#737780;--line:#ebeef5;--field:#dcdfe6;--bg:#f4f6f9;--thead:#f5f7fa;--side:250px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--line);overflow:auto;z-index:6}
.brand{display:flex;align-items:center;gap:12px;height:70px;padding:0 23px;color:#20232a;font-size:17px;font-weight:650;border-bottom:1px solid var(--line)}
.brand-mark{width:24px;height:24px;background:var(--blue);color:white;display:grid;place-items:center;border-radius:5px;font:bold 15px Arial}
.menu{padding:8px 0 30px}
.menu-title,.menu-item{width:100%;text-align:left;border:0;background:#fff;color:var(--ink);height:50px;padding:0 20px;display:flex;align-items:center;gap:12px}
.menu-title:hover,.menu-item[href]:hover{background:#f5f7fa;text-decoration:none}
.menu-title[aria-expanded=true] .chevron{transform:rotate(180deg)}
.menu-icon{width:18px;color:#687381;text-align:center;font:16px Arial,sans-serif}
.chevron{margin-left:auto;color:#8b919a;font-size:12px}
.menu-item{height:43px;padding-left:51px;text-decoration:none}
.menu-item.active{background:#edf2ff;color:var(--blue);font-weight:550;border-right:2px solid var(--blue)}
.menu-item.static,.menu-title.static{cursor:default}
[hidden]{display:none!important}
.shell{margin-left:var(--side);min-width:0}
.top{height:70px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{font-size:17px;font-weight:600;margin:0}
.top-right{display:flex;align-items:center;gap:10px;color:var(--muted);white-space:nowrap;font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#edf2ff;color:var(--blue);font-size:12px;font-weight:600}
.tabbar{display:flex;align-items:center;gap:8px;height:43px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;overflow:auto;white-space:nowrap}
.tabbar span,.tabbar a{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:3px;color:var(--text)}
.tabbar .active{border-color:#cbd7ff;color:var(--blue);background:#f3f6ff}
main{padding:17px 20px 28px;max-width:1920px;margin:0 auto}
.crumbs{font-size:12px;color:var(--muted);margin:0 0 12px}
.crumbs b{color:var(--ink);font-weight:500}
.crumbs .slash{margin:0 8px;color:#afb4be}
.panel{background:#fff;border:1px solid var(--line);border-radius:4px;min-width:0}
.padded{padding:17px 18px}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.page-head{margin-bottom:14px}
.page-head h2{font-size:18px;margin:0;font-weight:650}
h3{font-size:15px;margin:0 0 13px;font-weight:620}
h4{font-size:14px;margin:0 0 10px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
.button-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:5px 13px;border:1px solid var(--field);border-radius:3px;background:white;color:var(--text);font-size:12px;white-space:nowrap;text-decoration:none;line-height:1.5}
.button:hover{color:var(--blue);border-color:#bacbff;background:#f5f8ff;text-decoration:none}
.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.button.primary:hover{background:#4875ff}
.button.danger{color:#c83d47}
.button:disabled{opacity:.48;cursor:default}
.link-button{border:0;background:transparent;color:var(--blue);padding:3px 0;font-size:12px;white-space:nowrap}
.link-button:hover{text-decoration:underline}
.link-button.danger{color:#c83d47}
.filter-top{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px 12px}
.filters{padding:15px 16px 13px;margin-bottom:14px}
.filter-actions{margin-top:12px}
.filter-more{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 12px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.field{display:grid;gap:5px;min-width:0;color:var(--ink);font-size:12px}
.field .label{font-weight:500}
.control{width:100%;height:30px;border:1px solid var(--field);border-radius:3px;background:white;padding:0 8px;color:var(--text);font-size:13px;min-width:0}
.control:focus{border-color:var(--blue)}
.control::placeholder{color:#9c9fa7}
textarea.control{height:auto;min-height:68px;padding:7px 8px;resize:vertical}
.control[readonly]{background:#f7f8fa}
.range{grid-column:span 2}
.range-inputs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:5px;color:#a0a4ad}
.table-header{padding:12px 15px}
.table-header strong{font-weight:600}
.table-scroll{overflow:auto;max-width:100%}
.grid-table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;color:var(--text);white-space:nowrap}
.grid-table th,.grid-table td{padding:9px 10px;height:41px;text-align:left;border-bottom:1px solid var(--line)}
.grid-table th{font-weight:600;background:var(--thead);color:var(--ink);height:39px}
.grid-table td{background:#fff}
.grid-table tbody tr:nth-child(even) td{background:#fafafa}
.grid-table tbody tr:hover td{background:#f4f7ff}
.grid-table td.wrap{white-space:normal;min-width:125px;max-width:220px}
.grid-table .actions{position:sticky;right:0;z-index:1;border-left:1px solid #ebeff5}
.grid-table .actions a,.grid-table .actions button{margin-right:10px}
.grid-table .actions :last-child{margin-right:0}
.number{font-variant-numeric:tabular-nums}
.tag{display:inline-block;border:1px solid #e0e4eb;border-radius:3px;padding:1px 6px;color:#606266;background:#f7f8fa;font-size:11px;font-style:normal}
.tag+.tag{margin-left:4px}
.tag.blue{background:#edf3ff;color:#2855bf;border-color:#dbe7ff}
.tag.green{background:#f0f8ea;color:#397622;border-color:#deefd6}
.tag.orange{background:#fff6e8;color:#97621b;border-color:#f5e5ca}
.tag.red{background:#fff0f0;color:#aa343c;border-color:#f4d7da}
.pager{min-height:51px;padding:10px 15px;display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap;font-size:12px;color:var(--text)}
.pager .page-size{width:84px}
.pager .button{min-width:28px;min-height:28px;padding:2px 7px}
.pager .selected{background:var(--blue);border-color:var(--blue);color:white}
.empty{padding:42px 14px;text-align:center;color:var(--muted);font-size:13px}
.section-tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);padding:0 17px}
.section-tabs button{border:0;background:none;color:var(--text);padding:11px 1px;border-bottom:2px solid transparent;white-space:nowrap}
.section-tabs button[aria-selected=true]{color:var(--blue);border-color:var(--blue)}
.info-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px;margin:0}
.info-grid div{min-width:0}
.info-grid dt{color:var(--muted);margin-bottom:3px;font-size:12px}
.info-grid dd{margin:0;overflow-wrap:anywhere}
.stack{display:grid;gap:14px}
.balance-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.balance{padding:11px 14px;border:1px solid var(--line);background:#fafbfc;display:flex;justify-content:space-between;align-items:center;gap:12px}
.balance b{font-size:20px;color:#293343;font-weight:600}
.balance small{margin-left:4px;font-size:12px;color:var(--muted)}
.wizard{max-width:1100px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.form-space{margin-top:15px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label,.check{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text)}
.callout{padding:8px 11px;background:#f2f5ff;border:1px solid #e0e7fd;border-radius:3px;color:#394b77;font-size:12px}
.callout.warn{background:#fff8eb;border-color:#f3e3c0;color:#85540a}
.error{color:#b43f49;font-size:12px;margin:7px 0 0}
.actions-footer{margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
dialog{border:1px solid var(--line);border-radius:5px;padding:0;width:min(520px,calc(100vw - 28px));color:var(--ink);box-shadow:0 10px 32px #202c4930}
dialog::backdrop{background:#151e3261}
.dialog-head{padding:14px 17px;border-bottom:1px solid var(--line)}
.dialog-head h3{margin:0}
.dialog-body{padding:16px 17px}
.dialog-footer{padding:11px 17px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
dialog.drawer{margin:0 0 0 auto;inset:0 0 0 auto;max-height:100%;height:100%;width:min(540px,100vw);border-radius:0}
#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:10;background:#eff8ef;border:1px solid #d7ebd5;padding:9px 14px;border-radius:4px;color:#37652d;max-width:95vw}
@media(max-width:1180px){:root{--side:220px}.filter-top{grid-template-columns:repeat(4,minmax(0,1fr))}.filter-more{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:780px){:root{--side:145px}.brand{padding:0 9px;font-size:14px;gap:6px}.menu-title,.menu-item{padding-left:9px;font-size:12px;gap:5px}.menu-item{padding-left:25px}.top{padding:0 11px;height:58px}.top h1{font-size:14px}.top-right .label{display:none}main{padding:11px}.filter-top,.filter-more,.info-grid,.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.balance-grid{grid-template-columns:1fr}.rule-row{grid-template-columns:1fr 1fr}.section-tabs{gap:10px;overflow:auto}.button-row{gap:6px}}
.group-table .grid-table{min-width:1540px}
.group-table .table-scroll{scrollbar-width:none}
.group-table .table-scroll::-webkit-scrollbar{display:none}
.group-table td.group-name{font-weight:600;min-width:168px}
.group-table td.group-count{font-variant-numeric:tabular-nums;font-weight:600;color:#303133}
.group-scrollbar{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;gap:12px;padding:6px 15px;background:#fcfcfd;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.group-scrollbar input{flex:1;min-width:0;appearance:none;margin:6px 0;cursor:ew-resize;background:#edf0f4;height:8px;border-radius:8px}
.group-scrollbar input::-webkit-slider-thumb{appearance:none;width:var(--thumb,64px);height:8px;border-radius:8px;background:#8797af}
.group-scrollbar input::-moz-range-thumb{width:var(--thumb,64px);height:8px;border:0;border-radius:8px;background:#8797af}
.group-scrollbar input:disabled{cursor:default;opacity:.5}
.group-scrollbar span{white-space:nowrap}
.group-wizard{max-width:1320px}
.wizard-steps{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 23px;margin:0 0 14px;list-style:none}
.wizard-step{display:flex;align-items:center;gap:10px;color:var(--muted);min-width:0}
.wizard-step:not(:last-child)::after{content:"";margin:0 15px;flex:1;height:1px;background:#e4e8ef;min-width:2px}
.step-number{border:1px solid #dcdfe6;border-radius:50%;width:27px;height:27px;display:grid;place-items:center;background:#fff;font:600 13px Arial;flex:none}
.wizard-step.current{color:var(--blue);font-weight:600}
.wizard-step.current .step-number{border-color:var(--blue);background:var(--blue);color:#fff}
.wizard-step.done{color:#4b69a6}
.wizard-step.done .step-number{border-color:#dbe5fc;background:#eef3ff;color:#4166c9}
.wizard-scope{display:grid;grid-template-columns:minmax(205px,.47fr) 1fr;gap:14px;align-items:end}
.choices{display:flex;gap:7px;flex-wrap:wrap}
.wizard-caption{display:block;font-size:12px;color:var(--ink);font-weight:550;margin-bottom:8px}
.pill{font-size:12px;color:#505963;border:1px solid #dce2eb;padding:5px 10px;border-radius:4px;background:#fff;text-align:left;line-height:1.35}
.pill:hover{border-color:#aebfff;color:var(--blue)}
.pill[aria-pressed=true]{border-color:#b8caff;color:#2856ca;background:#edf3ff;font-weight:550}
.split-catalog{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:14px;align-items:start}
.catalog-header{padding:15px 16px 10px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.catalog-header h3{margin:0}
.catalog-tabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);overflow:auto}
.catalog-tabs button{white-space:nowrap;border:0;background:transparent;color:var(--text);padding:9px 0;border-bottom:2px solid transparent;font-size:12px}
.catalog-tabs button[aria-pressed=true]{color:var(--blue);border-color:var(--blue);font-weight:600}
.criteria-table{border-collapse:collapse;width:100%;font-size:12px}
.criteria-table th,.criteria-table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.criteria-table th{background:var(--thead);color:var(--ink);white-space:nowrap;font-weight:600}
.criteria-table tbody:last-of-type tr:last-child td,.criteria-table tbody:last-of-type .criteria-dimension{border-bottom:0}
.criteria-table .criteria-dimension{width:72px;color:var(--muted);background:#f8f9fc}
.criteria-table .criteria-field{width:135px;color:var(--ink);font-weight:550}
.criteria-table .chips{display:flex;gap:6px;flex-wrap:wrap}
.criteria-table .pill{padding:4px 8px}
.selected-summary{position:sticky;top:14px}
.summary-title{display:flex;align-items:center;justify-content:space-between;gap:6px}
.summary-title h3{margin:0;font-size:14px}
.summary-meta{margin:10px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.summary-rule{padding:8px 0;border-bottom:1px solid var(--line)}
.summary-rule:last-child{border-bottom:0;padding-bottom:0}
.summary-label{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--ink);font-weight:550;font-size:12px}
.summary-values{margin-top:4px;color:var(--text);font-size:12px;overflow-wrap:anywhere}
.wizard-footer{position:sticky;bottom:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;margin-top:14px;box-shadow:0 -4px 14px #28334d08}
.wizard-footer .error{margin:0}
.wizard-footer .button-row{margin-left:auto}
.wizard-preview .table-header{padding:15px 17px}
.preview-tools{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
.preview-tools .field{min-width:200px}
.group-description{display:grid;gap:7px;font-size:12px}
.group-name-input{max-width:475px}
.fixed-import{max-width:800px}
.fixed-import .import-box{padding:12px;background:#f8faff;border:1px dashed #c6d4f1;border-radius:4px}
@media(max-width:1120px){.split-catalog{grid-template-columns:minmax(0,1fr) 187px}.criteria-table th,.criteria-table td{padding:8px 9px}.criteria-table .criteria-field{width:109px}}
@media(max-width:780px){.split-catalog,.wizard-scope{grid-template-columns:1fr}.selected-summary{position:static}.wizard-steps{padding:11px 9px}.wizard-step{font-size:11px;gap:4px}.wizard-step:not(:last-child)::after{margin:0 5px}.step-number{width:21px;height:21px}.catalog-tabs{gap:11px}.wizard-footer{align-items:flex-start}}
.commercial-shell{max-width:1250px}
.commercial-layout{display:grid;grid-template-columns:minmax(0,1fr) 273px;gap:15px;align-items:start}
.commercial-side{position:sticky;top:14px}
.commercial-section{padding:18px}
.commercial-section h3{margin-bottom:14px}
.commercial-section .control,.commercial-section .button-row .pill{min-height:34px}
.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid.single{grid-template-columns:minmax(0,1fr)}
.form-grid .wide{grid-column:span 2}
.summary-list{margin:0;display:grid;gap:0}
.summary-list div{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:12px}
.summary-list div:first-child{border-top:0;padding-top:0}
.summary-list div:last-child{padding-bottom:0}
.summary-list dt{color:var(--muted);white-space:nowrap}
.summary-list dd{margin:0;text-align:right;overflow-wrap:anywhere;color:var(--ink);font-weight:500}
.compare-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice-card{display:grid;gap:4px;text-align:left;color:var(--ink);padding:10px 12px;border:1px solid var(--field);border-radius:4px;background:#fff;font-size:13px}
.choice-card[aria-pressed=true]{background:#f1f5ff;border-color:#adc0ff;color:#2955c4}
.choice-card strong{font-weight:600}
.choice-card small{font-size:12px;color:var(--muted)}
.commercial-actions{justify-content:space-between}
.commercial-actions .button-row{margin:0}
.readonly-box{padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:#f8f9fc}
.form-text{margin:8px 0 0;color:var(--muted);font-size:12px}
.table-status.tag+.tag{margin-left:5px}
.drawer .info-grid,.dialog-body .info-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.drawer .dialog-body h4:not(:first-child){margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}
.tag-field{max-width:590px;position:relative}
.tag-selection{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px;margin-top:8px}
.chosen-tags{display:flex;gap:6px;flex-wrap:wrap;max-height:80px;overflow:auto;padding:2px 1px;min-width:0}
.chosen-tag{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:3px 4px 3px 8px;border-radius:3px;border:1px solid #d6e3ff;background:#edf3ff;color:#2855b8;overflow-wrap:anywhere;font-size:12px}
.chosen-tag button{padding:0 5px;border:0;background:transparent;border-radius:3px;color:inherit;min-width:19px;font-size:14px;line-height:20px}
.chosen-tag button:hover{background:#dbe7ff}
.tag-picker-trigger span{margin-left:8px;color:#8b919a}
.tag-picker{width:min(385px,100%);margin-top:7px;padding:9px;border:1px solid var(--field);border-radius:4px;background:#fff;box-shadow:0 8px 22px #23334d14}
.tag-choice-list{max-height:174px;overflow:auto;margin-top:6px}
.pick-option{width:100%;display:flex;align-items:center;gap:8px;border:0;border-bottom:1px solid #f2f4f8;padding:7px 5px;text-align:left;background:#fff;color:var(--ink);font-size:12px}
.pick-option:hover{background:#f5f8ff}
.pick-option[aria-pressed=true]{color:var(--blue)}
.tick{display:grid;place-items:center;width:15px;height:15px;border:1px solid var(--field);border-radius:3px}
.pick-option[aria-pressed=true] .tick{background:var(--blue);border-color:var(--blue);color:#fff}
.picker-empty{padding:7px}
.picker-footer{padding-top:6px}
.tag-manager-toolbar{margin-bottom:10px;flex-wrap:nowrap}
.tag-manager-toolbar .control{flex:1}
#tag-manager-results .table-scroll{max-height:310px}
#tag-manager-results th{position:sticky;top:0;z-index:1}
.tag-delete-confirm{margin-bottom:10px}
.tag-delete-confirm .button-row{margin-top:8px}
@media(max-width:1050px){.commercial-layout{grid-template-columns:minmax(0,1fr) 190px}}
@media(max-width:780px){.commercial-layout{grid-template-columns:1fr}.commercial-side{position:static}.commercial-actions{flex-wrap:wrap}}

#toast[data-tone=warning]{background:#fff6e8;border-color:#f3e3c0;color:#85540a}
.outreach-five{grid-template-columns:repeat(5,minmax(0,1fr))}
.outreach-five .wizard-step:not(:last-child)::after{margin:0 9px}
.outreach-form{display:grid;gap:14px;}
.outreach-phone{width:min(100%,234px);min-height:305px;margin:3px auto 0;background:#edf2fc;border:1px solid #d9e1f0;border-radius:17px;padding:15px 12px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.outreach-phone .app-label{font-weight:600;font-size:12px;color:#52627e}
.outreach-notification{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;overflow-wrap:anywhere}
.outreach-notification h4{overflow-wrap:anywhere;margin:5px 0 3px}
.outreach-popup{background:#fff;border-radius:10px;padding:10px;position:relative;display:grid;gap:8px}
.outreach-popup .button{width:100%;white-space:normal}
.outreach-pic{aspect-ratio:5/2;display:grid;place-items:center;border:1px solid #e4eaf5;border-radius:4px;background:linear-gradient(132deg,#edf1fd,#d7e3fb);color:#58729f;font-size:12px;overflow:hidden}
.outreach-phone .outreach-pic{aspect-ratio:4/3}
.outreach-pic img{width:100%;height:100%;object-fit:cover;display:block}
.outreach-targets{display:grid;gap:5px;max-height:255px;overflow:auto;border:1px solid var(--line);padding:8px 10px}

function esc(value) {
  const symbols = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  return String(value ?? '').replace(/[&<>"']/g, char => symbols[char]);
}
function option(value, label, current) {
  return `<option value="${esc(value)}"${String(value) === String(current ?? '') ? ' selected' : ''}>${esc(label)}</option>`;
}
function input(name, label, value='', extra='') {
  return `<label class="field"><span class="label">${esc(label)}</span><input class="control" name="${esc(name)}" value="${esc(value)}" ${extra}></label>`;
}
function select(name, label, items, current='', extra='') {
  return `<label class="field"><span class="label">${esc(label)}</span><select class="control" name="${esc(name)}" ${extra}>${items.map(item => Array.isArray(item) ? option(...item,current) : option(item,item,current)).join('')}</select></label>`;
}
function range(prefix, label, q) {
  return `<div class="field range"><span class="label">${label}</span><div class="range-inputs">
    <input class="control" type="date" name="${prefix}From" aria-label="${label}开始日期" value="${esc(q[prefix+'From'])}">

  </div></div>`;
}
function button(label, action, appearance='') {

}
function linkAction(label, action, id='', appearance='') {

}
function tag(value, color='') {

}

}
function table(columns, rows) {

  return `<div class="table-scroll" tabindex="0" aria-label="表格"><table class="grid-table"><thead><tr>${head}</tr></thead><tbody>${

  }</tbody></table></div>`;
}

const groupLabels = type => type === 'fixed' ? '固定名单' : '规则分组';
const opLabels = {eq:'等于',lte:'不超过',gte:'不少于'};
function groupedRules(rules) {
  const groups = new Map();
  for (const rule of rules || []) {
    if (!allGroupCriteria[rule.field] || rule.value==='') continue;
    if (!groups.has(rule.field)) groups.set(rule.field,[]);
    groups.get(rule.field).push(rule);
  }
  return groups;
}
function matchesRule(actual, rule) {
  if (actual === null || actual === undefined || actual === '') return false;
  if (Array.isArray(actual)) return actual.some(value=>matchesRule(value,rule));
  if (rule.op==='preset') {
    const choice=groupCriteria[rule.field]?.choices.find(item=>item.label===rule.value) ||
      legacyGroupCriteria[rule.field]?.choices.find(item=>item.label===rule.value);
    if (!choice) return false;
    if ('value' in choice) return actual===choice.value;
    const meetsMinimum=choice.openMin?actual>choice.min:actual>=choice.min;
    return Number.isFinite(actual) && meetsMinimum && (choice.max===undefined || actual<=choice.max);
  }
  if (rule.op==='lte') return Number(actual)<=Number(rule.value);

      'value' in choice ? rule.op==='eq' && choice.value===rule.value :
      rule.op==='eq' && choice.min===+rule.value && choice.max===+rule.value ||
      rule.op==='lte' && choice.min===0 && choice.max===+rule.value ||

    const matches=[...rules].map(([field,picks])=>{
      const fieldMatches=actual=>{
        const presets=picks.filter(rule=>rule.op==='preset');

        if (group.match==='any') return picks.some(rule=>matchesRule(actual,rule));

  return table(['标签名称','使用分组','操作'],names.map(name=>[

function tagManager() {
  tagPendingDelete='';
  showDialog('管理分组标签',`<div class="split tag-manager-toolbar">
    <input class="control" type="search" data-tag-search="manager" aria-label="搜索标签" placeholder="搜索标签" value="${esc(tagsQuery)}">
    ${button('＋ 新建标签','create-library-tag','primary')}
  </div><div id="tag-delete-box"></div><div id="tag-manager-results">${tagManagerResults()}</div>`);
}
function newTagDialog(origin) {
  showDialog('新建分组标签',`<div class="form-grid single">${input('new-tag','标签名称','','maxlength="24" placeholder="如：售后回访"')}
    <p id="tag-input-error" class="error" hidden></p></div>`,'创建标签',()=>{
    const field=modal.querySelector('[name=new-tag]');
    const name=field.value.trim();
    const error=modal.querySelector('#tag-input-error');
    const message=!name?'请输入标签名称。':/[，,]/.test(name)?'每次创建一个标签，请去掉逗号。':
      tagCatalog.some(item=>item.toLowerCase()===name.toLowerCase())?'这个名称已存在，请从列表中选择。':'';
    if (message) { error.textContent=message;error.hidden=false;field.focus();return false; }
    tagCatalog.push(name);
    writeStore(tagStoreKey,tagCatalog);
    notify('标签已创建');
    if (origin==='wizard' && wizard) {wizard.tags.add(name);refreshTagPicker();}
    if (origin==='library') {
      tagsQuery='';
      tagManager();
      return false;
    }
  });
  modal.querySelector('[name=new-tag]')?.focus();
}
function confirmTagDeletion(name) {
  if (!tagCatalog.includes(name)) return;
  tagPendingDelete=name;
  const affected=tagUsage(name);
  modal.querySelector('#tag-delete-box').innerHTML=`<div class="callout warn tag-delete-confirm">
    <div>删除「${esc(name)}」${affected?'会从 '+affected+' 个分组移除该标签':'后将从标签库移除'}。分组成员照常保留。</div>
    <div class="button-row">${button('取消','cancel-tag-delete')}${button('确认删除','commit-tag-delete','danger')}</div></div>`;
}
function deleteTag() {
  const name=tagPendingDelete;
  if (!tagCatalog.includes(name)) return;
  tagCatalog=tagCatalog.filter(item=>item!==name);
  groups=groups.map(group=>group.tags.includes(name)?{...group,tags:group.tags.filter(tagName=>tagName!==name)}:group);
  wizard?.tags.delete(name);
  writeStore(tagStoreKey,tagCatalog);
  saveGroups();
  if (scope.groups.tag===name) scope.groups.tag='';
  if (applied.groups.tag===name) { applied.groups.tag='';paging.groups=1; }
  render();
  tagManager();
  notify('标签已删除');
}

function filterGroups(q) {
  return groups.filter(group => (includes(group.name,q.name)||includes(group.id,q.name)) &&
    (!q.tag||group.tags.includes(q.tag)) && inRange(group.created,q.madeFrom,q.madeTo))
    .sort((a,b)=>b.created.localeCompare(a.created) || b.id.localeCompare(a.id));
}
function groupActions(group) {
  const action = (text,action,appearance='') => linkAction(text,action,group.id,appearance);
  const status=currentGroupStatus(group);
  if (status === '已停用') return `<a href="#/groups/${group.id}">查看</a>`;
  if (status === '已引用') return `<a href="#/groups/${group.id}">查看</a>`+
    action('导出','export-group')+action('复制新建','copy-group')+action('停用','stop-group','danger');
  return `<a href="#/groups/${group.id}">查看</a>`+action('编辑','edit-group')+
    action('导出','export-group')+action('删除','delete-group','danger');
}
let groupScrollLeft=0;
function syncGroupScroll() {
  const scroll=main.querySelector('.group-table .table-scroll');
  const slider=main.querySelector('#groups-scroll-bar');
  if (!scroll || !slider) return;
  const max=Math.max(0,scroll.scrollWidth-scroll.clientWidth);
  slider.max=String(max);
  slider.disabled=max===0;
  slider.style.setProperty('--thumb',Math.max(38,Math.round(slider.clientWidth*scroll.clientWidth/scroll.scrollWidth))+'px');
  scroll.scrollLeft=Math.min(groupScrollLeft,max);
  slider.value=String(scroll.scrollLeft);
  slider.setAttribute('aria-valuetext',max ? Math.round(scroll.scrollLeft/max*100)+'%' : '已完整显示');
}

function ruleCatalog() {
  const w=wizard;
  const selected=groupedRules(w.rules);
  const categories=groupSections.map(section=>{
    const count=[...selected.keys()].filter(key=>allGroupCriteria[key].section===section).length;
    return `<button type="button" data-action="catalog-tab" data-id="${section}" aria-pressed="${w.category===section}">${section}${count?' · '+count:''}</button>`;
  }).join('');
  const fields=Object.entries(groupCriteria);
  const sections=groupSections.slice(1).filter(section=>w.category==='全部'||w.category===section);
  const bodies=sections.map(section=>{
    const rows=fields.filter(([,meta])=>meta.section===section);
    return '<tbody>'+rows.map(([key,meta],index)=>{
      const picks=selected.get(key)||[];
      let choices=meta.choices.map(choice=>presetChip(choice.label,'toggle-preset',key+':'+choice.label,
        picks.some(rule=>rule.op==='preset'&&rule.value===choice.label))).join('');

      return `<tr>${index===0?`<th scope="rowgroup" class="criteria-dimension" rowspan="${rows.length}">${esc(section)}</th>`:''}
        <td class="criteria-field">${esc(meta.label)}</td><td><div class="chips">${choices}</div></td></tr>`;
    }).join('')+'</tbody>';
  }).join('');
  const legacy=w.rules.some(rule=>rule.op!=='preset' || !groupCriteria[rule.field]?.choices.some(choice=>choice.label===rule.value));
  return `<div class="split-catalog">
    <section class="panel" aria-label="筛选条件">

function updatePreview() {
  const w=wizard;
  w.query=''; w.previewPage=1; w.sort='desc'; w.missing=[];
  if (w.type==='rule') {
    w.preview=ruleUsers(w);
  } else {
    w.preview=users.filter(user=>!w.series||bound(user,w.series).length);
    const ids=w.importIds.split(/[\s,，;；]+/).filter(term=>term && !/^(id|用户id|用户)$/i.test(term)).map(term=>term.replace(/^"|"$/g,'').toUpperCase());
    const valid=new Set(w.preview.map(user=>user.id));
    for (const id of new Set(ids)) {
      if (valid.has(id)) w.selected.add(id);
      else w.missing.push(id);
    }
    w.selected=new Set([...w.selected].filter(id=>valid.has(id)));
  }
}
function timestamp() {
  return new Date().toISOString().slice(0,16).replace('T',' ')+' UTC';
}
function wizardNext() {
  const w=wizard;
  w.error='';
  if (w.step===1) {
    if (w.type==='rule' && !w.series && !w.rules.length) {
      w.error='请选择一个产品系列或至少一个筛选条件。';
    } else if (w.type==='rule' && w.rules.some(rule=>rule.op!=='preset')) {
      w.error='历史条件需移除或改用预设取值后再预览。';
    } else {
      updatePreview();
      w.step++;
    }
  } else if (w.step===2) {
    if (w.type==='fixed' && !w.selected.size) w.error='请勾选至少一个账号。';
    else w.step++;
  } else if (!w.name.trim()) {
    w.error='请输入分组名称。';
  } else {
    const current=groupById(w.editing);
    const group={
      id:current?.id||makeGroupId(),name:w.name.trim(),desc:w.desc.trim(),series:w.series,type:w.type,match:w.match,
      rules:w.type==='rule'?w.rules.map(rule=>({...rule})):[],
      tags:[...w.tags].filter(name=>tagCatalog.includes(name)),
      time:timestamp(),created:current?.created||timestamp().slice(0,10),status:'未引用',refs:[],
      members:w.type==='rule'?w.preview.map(user=>user.id):[...w.selected]
    };
    groups=current?groups.map(entry=>entry.id===current.id?group:entry):[group,...groups];
    saveGroups();
    paging.groups=1;
    scope.groups={}; applied.groups={};
    notify(current?'分组已更新':'分组已生成');
    go('#/groups');
    return;
  }
  renderWizard();
}

function csvDownload(filename,head,rows) {
  const quote = value => {
    let raw=String(value ?? '');
    if (/^[=+@\-\t\r]/.test(raw)) raw="'"+raw;
    return '"'+raw.replace(/"/g,'""')+'"';
  };
  const csv='\ufeff'+[head,...rows].map(line=>line.map(quote).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const anchor=document.createElement('a');
  anchor.href=url;anchor.download=filename;
  document.body.append(anchor);anchor.click();anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

  dialogAction=callback;
  modal.showModal();
}

function buildBatchReport(entry) {
  let sourceLabel='导入用户 ID';
  let inputIds=[];
  if(entry.source==='group') {
    const group=groupById(entry.groupId);
    if(!group) return {error:'请选择一个用户分组。'};
    if(group.status==='已停用') return {error:'该分组已停用，请更换分组。'};
    if(group.failed) return {error:'该分组名单计算失败，请重新计算或更换分组。'};
    sourceLabel=group.id+' · '+group.name;
    inputIds=group.type==='rule'?ruleUsers(group).map(user=>user.id):group.members;
  } else {
    inputIds=entry.ids.trim().split(/[\s,，;；]+/).filter(Boolean)
      .map(id=>id.replace(/^"|"$/g,'').toUpperCase()).filter(Boolean);
    if(['ID','UID','USER_ID','用户ID'].includes(inputIds[0])) inputIds.shift();
    if(inputIds[0]==='用户'&&inputIds[1]==='ID') inputIds.splice(0,2);
    if(!inputIds.length) return {error:'请粘贴用户 ID 或上传名单。'};
  }
  const accounts=[];
  const excluded=[];
  const uniqueIds=[...new Set(inputIds)];
  for(const uid of uniqueIds) {
    const user=memberById(uid);
    if(!canUseBenefit(user)) {
      excluded.push({uid,reason:'账号不存在或不在可操作范围'});
    } else if(entry.region&&user.region!==entry.region) {
      excluded.push({uid,reason:'不在所选区域'});
    } else {
      accounts.push(user);
    }
  }
  return {sourceLabel,inputCount:inputIds.length,duplicates:inputIds.length-uniqueIds.length,accounts,excluded};
}

    const retried=timestamp();

      member.state==='发放失败'?finishBatchRecipient(record,member,retried):member
    )}:record);
    if(!persistBatchTasks(tasks)) return false;
    batchResultFilter='';render();notify('模拟重试完成');
  });
}

function collectPlan() {
  const form=main.querySelector('#plan-form');
  if (!form||planDraft.step) return;
  Object.assign(planDraft,formValues(form));
  if(planDraft.limited==='yes') planDraft.mode='定时上架';
}
function validatePlan(entry,partial=false) {
  if (!entry.name.trim()) return '请输入套餐名称。';
  if (partial) return '';
  if (planSku(entry.sku)?.line!==entry.line) return '请选择适用的内购 SKU。';
  if (entry.access==='group') {
    const group=planGroup(entry.groupId);
    if (!group||!groupForPlan(entry,group)||group.status==='已停用'||group.failed) return '所选分组不可用，请更换分组后再上架。';
  }
  const when=atUtc(entry.startAt), end=atUtc(entry.endAt), now=Date.now();
  if (entry.mode==='定时上架'&&!(when>now)) return '定时上架时间须晚于当前 UTC 时间。';
  if (entry.limited==='yes' && !entry.endAt) return '限定套餐须设置下架时间。';
  if (entry.endAt && !(end>(entry.mode==='定时上架'?when:now))) return '下架时间须晚于上架时间。';
  if (!Number.isInteger(Number(entry.position))||Number(entry.position)<1) return '排序须为大于 0 的整数。';
  if (entry.jump&&!/^https?:\/\//i.test(entry.jump)) return '请输入有效的 HTTP 或 HTTPS 链接。';
  return '';
}
function planError(message) {
  planDraft.error=message;
  const error=main.querySelector('#plan-error');
  error.textContent=message;error.hidden=!message;
}
function previewPlan() {
  collectPlan();
  const error=validatePlan(planDraft);
  if (error) {planError(error);return;}
  planDraft.step=1;planDraft.error='';renderPlanEditor();
}
function savePlan(publish) {
  collectPlan();
  const draft=planDraft;
  const error=validatePlan(draft,!publish);
  if (error) {planError(error);return;}
  if (draft.id && planById(draft.id)?.status!=='草稿') {notify('该套餐状态已变化，请回到列表');return;}
  const id=draft.id||'P-'+(Math.max(1000,...plans.map(plan=>Number(plan.id.slice(2))))+1);
  const status=!publish?'草稿':draft.mode==='定时上架'?'待上架':'已上架';
  const time=timestamp();
  const entry={
    id,family:draft.family||id,name:draft.name.trim(),line:draft.line,sku:draft.sku,region:draft.region,
    series:draft.line==='观鸟线'?draft.series:'',access:draft.access,groupId:draft.access==='group'?draft.groupId:'',
    status,mode:draft.mode,startAt:publish&&draft.mode==='立即上架'?time.slice(0,16).replace(' ','T'):draft.startAt,endAt:draft.endAt,
    limited:draft.limited,trial:draft.trial,display:draft.display,jump:draft.jump,position:draft.position,version:draft.version,
    log:[...draft.log,[time,publish?draft.mode:'保存草稿']]
  };
  plans=draft.id?plans.map(plan=>plan.id===id?entry:plan):[entry,...plans];
  writeStore(planKey,plans);
  planDraft=null;
  scope.plans={};applied.plans={};paging.plans=1;
  go('#/plans');
  notify(publish?status==='待上架'?'定时上架已配置':'套餐已上架':'套餐草稿已保存');
}

function confirmPlan(plan,action) {
  const [label,expected]={
    off:['下架','已上架'],cancel:['取消定时','待上架'],delete:['删除','草稿']
  }[action];
  if (plan.status!==expected) return;
  showDialog(label+'套餐',`<p>确定${label}「${esc(plan.name)}」？</p>${action==='off'?'<p class="small muted">下架后停止新展示，已购权益按原有效期履约。</p>':''}`,label,()=>{
    if (action==='delete') plans=plans.filter(entry=>entry.id!==plan.id);
    else {
      plan.status=action==='off'?'已下架':'草稿';
      plan.log.push([timestamp(),label]);
    }
    writeStore(planKey,plans);
    renderPlans();notify('操作已完成');
  },false,true);
}

const OutreachSchedule=(()=>{
  function nextPushRun(form, now = new Date()) {
    if (form.pushSchedule === 'once') {
      return Date.parse(`${form.pushAt}Z`) > now.getTime() ? form.pushAt : '';
    }
    if (!form.start || !form.end || !form.pushTime) return '';
    const today = now.toISOString().slice(0, 10);
    let day = form.start > today ? form.start : today;
    if (day === today && Date.parse(`${day}T${form.pushTime}Z`) <= now.getTime()) {
      const tomorrow = new Date(now);
      tomorrow.setUTCDate(tomorrow.getUTCDate() + 1);
      day = tomorrow.toISOString().slice(0, 10);
    }
    return day <= form.end ? `${day}T${form.pushTime}` : '';
  }

  function hasCycleDate(form) {
    const start = new Date(`${form.start}T00:00:00Z`);
    const end = new Date(`${form.end}T00:00:00Z`);
    if (!(start <= end)) return false;
    if (form.cycle === 'daily') return true;
    if (form.cycle === 'weekly') {
      const mondayBasedDay = (start.getUTCDay() + 6) % 7;
      return form.days.some((day) => {
        const offset = (Number(day) - mondayBasedDay + 7) % 7;
        const next = new Date(start);
        next.setUTCDate(next.getUTCDate() + offset);
        return next <= end;
      });
    }
    const month = new Date(start);
    month.setUTCDate(1);
    while (month <= end) {
      const occurrence = new Date(month);
      occurrence.setUTCDate(Number(form.dayOfMonth));
      if (occurrence.getUTCMonth() === month.getUTCMonth() && occurrence >= start && occurrence <= end) return true;
      month.setUTCMonth(month.getUTCMonth() + 1);
    }
    return false;
  }

  return {nextPushRun,hasCycleDate};
})();

function updateOutreachStatus() {
  let changed=false;
  for(const record of outreachRecords) {
    const f=record.form;
    const first=record.firstAt|| (f.start?f.start+'T00:00':'');
    if(record.state==='待发布'&&first&&atUtc(first)<=Date.now()) {
      record.state='已发布';
      record.log.push([timestamp(),outreachGroupIssue(f)?'到达计划时间，分组不可用，跳过本次触达':'到达计划时间']);
      changed=true;
    }
  }
  if(changed) writeStore(outreachKey,outreachRecords);
}

function collectOutreach() {
  if(!outreachDraft) return;
  const form=main.querySelector('#outreach-form');
  if(!form) return;
  const submitted=new FormData(form);
  for(const [name,value] of submitted) {
    if (name!=='days'&&name!=='tagIds') outreachDraft.form[name]=value;
  }
  if(outreachStep===2&&outreachDraft.form.audience==='tags') outreachDraft.form.tagIds=submitted.getAll('tagIds');
  if(outreachStep===3&&outreachDraft.form.trigger==='cycle'&&outreachDraft.form.cycle==='weekly') outreachDraft.form.days=submitted.getAll('days');
}
function validOutreachUrl(value) {
  try {const parsed=new URL(value);return ['http:','https:'].includes(parsed.protocol)&&Boolean(parsed.hostname);}
  catch {return false;}
}
function validJump(form,prefix) {
  return form[prefix+'Jump']==='none' ||
    (form[prefix+'Jump']==='internal'&&outreachPages.includes(form[prefix+'Page'])) ||
    (form[prefix+'Jump']==='external'&&validOutreachUrl(form[prefix+'Url']));
}
function checkOutreachStep(form,step) {
  if(step===0) {
    if(!form.name.trim()||!modelsForLine(form.line).includes(form.model)) return '请输入策略名称并选择产品系列。';
  }
  if(step===1) {
    if(form.channel==='push') {
      if(!form.body.trim()) return '请填写 Push 的英文正文。';
      if(!validJump(form,'push')) return '请完善 Push 点击跳转。';
    } else {
      if(!validJump(form,'image')) return '请完善弹窗图片跳转。';
      if(form.buttonStyle!=='none'&&(!form.primaryText.trim()||!validJump(form,'primary'))) return '请填写按钮文案及跳转目标。';
      if(form.buttonStyle==='dual'&&(!form.secondaryText.trim()||!validJump(form,'secondary'))) return '请填写次按钮文案及跳转目标。';
    }
  }
  if(step===2) {
    if(!form.audience) return '请选择推送人群。';
    if(form.audience==='tags'&&(!form.tagIds.length||form.tagIds.some(id=>!selectableAudienceTags(form).some(tag=>tag[0]===id))))
      return '请选择适用于当前系列和渠道的受众标签。';
    return outreachGroupIssue(form);
  }
  if(step===3) {
    if(form.channel==='push') {
      if(!OutreachSchedule.nextPushRun(form)) return '请填写一个未来的 UTC 下发时刻或有效日期区间。';
    } else {
      if(!form.start||!form.end||form.start>form.end||form.end<isoToday()) return '请填写有效的 UTC 起止日期。';
      if(form.trigger==='cycle'&&!OutreachSchedule.hasCycleDate(form)) return '生效期内至少需要有一个符合周期的日期。';
    }
  }
  return '';
}
function setOutreachError(message) {
  outreachError=message;
  const element=document.querySelector('#outreach-error');
  element.textContent=message;element.hidden=false;
}
function submitOutreach() {
  collectOutreach();
  const form=outreachDraft.form;
  if(outreachStep<4) {
    const issue=checkOutreachStep(form,outreachStep);
    if(issue){setOutreachError(issue);return;}
    outreachStep++;outreachError='';outreachPreviewClosed=false;renderOutreachEditor(outreachDraft.id);
  } else saveOutreach(true);
}
function saveOutreach(publish) {
  collectOutreach();
  const draft=outreachDraft, form=draft.form;
  if(!form.name.trim()) {setOutreachError('请填写策略名称。');return;}
  if(publish) {
    for(let index=0;index<4;index++) {
      const issue=checkOutreachStep(form,index);
      if(issue){outreachStep=index;outreachError=issue;renderOutreachEditor(draft.id);return;}
    }
  }
  const before=outreachById(draft.id);
  const firstAt=publish?firstOutreachRun(form):'';
  const state=publish?atUtc(firstAt)>Date.now()?'待发布':'已发布':'草稿';
  const record={id:before?.id||'ST-'+(Math.max(1000,...outreachRecords.map(row=>Number(row.id.slice(3))))+1),
    form:structuredClone(form),state,firstAt,created:before?.created||timestamp(),metrics:before?.metrics||{},
    log:[...(before?.log||[]),[timestamp(),publish?'发布策略':'保存草稿']]};
  outreachRecords=before?outreachRecords.map(row=>row.id===record.id?record:row):[record,...outreachRecords];
  writeStore(outreachKey,outreachRecords);
  outreachDraft=null;scope.strategies={};applied.strategies={};paging.strategies=1;
  go('#/strategies');notify(publish?'演示策略已发布':'策略草稿已保存');
}
function renderOutreachDetails(record) {
  const form=record.form;
  main.innerHTML=crumb('运营管理','策略详情',outreachParent)+pageHead('策略详情',
    linkAction('复制新建','copy-strategy',record.id)+button('停用','stop-current-strategy','danger'))+`
    <div class="commercial-layout"><div class="stack">
      ${commercialSection('配置详情',outreachReviewContent(form))}
      ${commercialSection('数据追踪',infos(metricText(form,record.metrics)))}
      ${commercialSection('操作记录',table(['时间','操作'],record.log))}
    </div><aside class="panel commercial-section commercial-side"><h3>App 预览</h3>${renderAppPreview(form)}</aside></div>`;
}
function copyOutreach(record) {
  outreachRecords.unshift({id:'ST-'+(Math.max(1000,...outreachRecords.map(row=>Number(row.id.slice(3))))+1),
    form:{...structuredClone(record.form),name:record.form.name.slice(0,55)+' 副本'},state:'草稿',
    firstAt:'',created:timestamp(),metrics:{},log:[[timestamp(),'复制新建']]});
  writeStore(outreachKey,outreachRecords);
  scope.strategies={};applied.strategies={};paging.strategies=1;
  go('#/strategies');notify('草稿已创建并置顶');
}
function confirmOutreach(record,action) {
  const stop=action==='stop';
  if(!record || (stop?record.state!=='已发布':record.state==='已发布')) return;
  const label=stop?'停用':'删除';
  showDialog(label+'策略',`<p>确定${label}「${esc(record.form.name)}」？</p>` ,label,()=>{
    if(stop){record.state='已停用';record.log.push([timestamp(),'停用']);}
    else outreachRecords=outreachRecords.filter(row=>row.id!==record.id);
    writeStore(outreachKey,outreachRecords);go('#/strategies');notify('策略已'+label);
  },false,true);
}

function conflictBanner(record) {
  return banners.find(row=>row.id!==record.id && row.state==='启用' && row.app===record.app &&
    row.placement===record.placement&&row.line===record.line&&row.order===record.order&&
    (row.model===record.model||row.model===allModels||record.model===allModels)&&
    (row.region===record.region||row.region==='全量'||record.region==='全量') &&
    atUtc(row.startAt)<=atUtc(record.endAt) && atUtc(record.startAt)<=atUtc(row.endAt));
}
function validateBanner(record) {
  if(!record.title.trim()||!record.image) return '请填写标题并上传 Banner 图片。';
  if(!modelsForLine(record.line).includes(record.model)) return '请选择可见产品系列。';
  if(!validJump(record,'banner')) return '请完善站内页面或站外网址。';
  if(!(atUtc(record.startAt)<atUtc(record.endAt))) return '请填写有效的 UTC 生效时间段。';
  const conflict=conflictBanner(record);
  if(conflict) return '与「'+conflict.title+'」的投放范围和生效时段重叠，请调整轮播顺序。';
  return '';

  const record={...bannerDraft,id:before?.id||'BN-'+(Math.max(1000,...banners.map(row=>Number(row.id.slice(3))))+1),
    state:enable?'启用':bannerDraft.state,clicks:before?.clicks||0,created:before?.created||timestamp()};
  banners=before?banners.map(row=>row.id===record.id?record:row):[record,...banners];

    const form=outreachDraft.form;
    if(e.name==='line'&&oldLine!==form.line&&form.model!==allModels)form.model=outreachProducts[form.line][0];
    if(['line','model','channel'].includes(e.name)) {
      form.tagIds=form.tagIds.filter(id=>selectableAudienceTags(form).some(tag=>tag[0]===id));
      if(form.audience==='tags'&&!selectableAudienceTags(form).length)form.audience='';
      if(form.groupId&&!compatibleGroups(form).some(group=>group.id===form.groupId))form.groupId='';
    }
    outreachError='';renderOutreachEditor(outreachDraft.id);return;
  }
  if(e.matches('[data-outreach-refresh]')&&e.closest('#banner-form')) {
    collectBanner();
    if(e.name==='line'&&bannerDraft.model!==allModels)bannerDraft.model=outreachProducts[bannerDraft.line][0];
    bannerError='';renderBannerEditor(bannerDraft.id);return;
  }
  if(e.matches('[data-batch-result]')) {
    batchResultFilter=e.value;renderBatchDetail(batchById(navPath()[1]));return;
  }
  if(e.closest('#batch-form')&&['item','timing'].includes(e.name)) {
    collectBatch();batchDraft.error='';renderBatchEditor();return;
  }
  if(e.id==='batch-file'&&e.files[0]) {
    const draft=batchDraft, file=e.files[0];
    try {
      const data=await file.text();
      if(draft===batchDraft&&draft.step===0&&navPath()[0]==='batch-benefits'&&navPath()[1]==='new') {
        collectBatch();draft.ids=data;draft.fileName=file.name;draft.error='';draft.report=null;
        renderBatchEditor();
      }
    } catch {
      if(draft===batchDraft&&e.isConnected) showBatchError('文件读取失败，请重新选择。');
    }
    return;
  }
  if (e.matches('[data-benefit-filter]')) {
    benefitTaskFilter=e.value;renderBenefitTasks(memberById(navPath()[1]));return;
  }
  if (e.name==='item' && e.closest('#benefit-form')) {
    collectBenefit();benefit.error='';renderBenefit(memberById(benefit.uid));return;
  }
  if (e.closest('#plan-form') && ['line','sku','region','series','access','mode','limited'].includes(e.name)) {
    const previousLine=planDraft.line;
    collectPlan();
    if(previousLine!==planDraft.line){planDraft.sku='';planDraft.series='';planDraft.access='all';planDraft.groupId='';}
    if(planDraft.access==='all')planDraft.groupId='';
    if(planDraft.mode==='立即上架')planDraft.startAt='';
    planDraft.error='';renderPlanEditor();return;
  }
  if (e.id==='group-file' && e.files[0]) {
    const file=e.files[0], current=wizard;
    try {
      const imported=await file.text();
      if (current!==wizard || navPath()[1]!=='new') return;
      current.importIds=imported;current.fileName=file.name;current.error='';renderWizard();
    } catch { current.error='文件读取失败，请重新选择。';renderWizard(); }
    return;
  }
});
document.addEventListener('submit',event=>{
  event.preventDefault();
  const form=event.target;
  if (form.dataset.search) applySearch(form);
  else if (form.matches('[data-preview-search]')) {
    wizard.query=formValues(form).lookup;wizard.previewPage=1;renderWizard();
  } else if (form.id==='benefit-form' && !benefit.step) previewBenefit();
  else if(form.id==='batch-form') submitBatch();
  else if (form.id==='plan-form' && !planDraft.step) previewPlan();
  else if (form.id==='outreach-form') submitOutreach();
  else if (form.id==='banner-form') saveBanner(false);
});
window.addEventListener('hashchange',()=>{
  if (modal.open) modal.close();
  if(navPath()[0]!=='batch-benefits'||navPath()[1]!=='new') batchDraft=null;
  batchResultFilter='';
  if(location.hash!==notificationRoute) document.querySelector('#toast').hidden=true;
  window.scrollTo(0,0);
  render();
});
processBatchQueue();
render();
</script>
</body>
</html>
